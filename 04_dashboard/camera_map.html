<style>:root{--bg:#f4f3ef;--ink:#1c1e21;--muted:#6b717a;--line:#e2e0d9;--surface:#fff}

body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans Thai",system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}

main{flex:1;display:flex;min-height:0}#map{flex:1}aside{width:340px;overflow:auto;border-left:1px solid var(--line);background:var(--surface)}
input{margin:8px;width:calc(100% - 16px);padding:6px 8px;font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.it{padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer}.it:hover{background:var(--bg)}.it b{font-weight:600}.it small{color:var(--muted);display:block}
@media(max-width:700px){main{flex-direction:column}aside{width:auto;height:40vh;border-left:0;border-top:1px solid var(--line)}}</style></head>
